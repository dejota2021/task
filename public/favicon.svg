<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- White squircle background exactly matching user image -->
  <rect x="32" y="32" width="448" height="448" rx="124" fill="#ffffff" />
  
  <!-- Left horizontal list bars (dark grey, rounded caps) -->
  <g stroke="#4e4e4e" stroke-width="24" stroke-linecap="round">
    <line x1="138" y1="210" x2="242" y2="210" />
    <line x1="138" y1="262" x2="228" y2="262" />
    <line x1="138" y1="314" x2="242" y2="314" />
  </g>

  <!-- Right circle with blue-to-purple gradient -->
  <defs>
    <linearGradient id="circle-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#4a00e0" />
    </linearGradient>
  </defs>
  
  <circle cx="316" cy="262" r="62" fill="url(#circle-gradient)" />

  <!-- Bold white checkmark inside the gradient circle -->
  <path d="M285 264 L306 285 L347 236" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
</svg>
