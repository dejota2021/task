<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Subtle dark background -->
  <rect width="48" height="48" rx="12" fill="#09090b" />
  
  <!-- Outer container matching the header style: bg-indigo-600/10 border border-indigo-500/30 rounded-xl -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="rgba(79, 70, 229, 0.12)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.5" />
  
  <!-- Glow/drop-shadow filter exactly matching drop-shadow-[0_0_4px_rgba(99,102,241,0.5)] -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Lucide ListTodo SVG icon, centered inside (box: x=13, y=13, width=22, height=22) -->
  <g transform="translate(13, 13)" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <rect x="2" y="3" width="5" height="5" rx="1" />
    <path d="m2 15 1.5 1.5 3.5-3.5" />
    <path d="M10 4h10" />
    <path d="M10 10h10" />
    <path d="M10 16h10" />
    <path d="m2 9 1.5 1.5 3.5-3.5" />
  </g>
</svg>
