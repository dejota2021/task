    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
      /* Ultra-clean pitch black and slate grey theme background */
      html, body {
        background-color: #09090b;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        touch-action: pan-x pan-y;
      }

      /* Independent 3D Floating and rotating keyframes for cards with depth */
      @keyframes float3dOdd {
        0% { transform: perspective(1000px) translateY(0px) rotateY(0deg) rotateX(0deg); }
        25% { transform: perspective(1000px) translateY(-5px) rotateY(1.5deg) rotateX(0.5deg); }
        50% { transform: perspective(1000px) translateY(-2px) rotateY(-1deg) rotateX(-0.5deg); }
        75% { transform: perspective(1000px) translateY(-6px) rotateY(0.8deg) rotateX(1deg); }
        100% { transform: perspective(1000px) translateY(0px) rotateY(0deg) rotateX(0deg); }
      }

      @keyframes float3dEven {
        0% { transform: perspective(1000px) translateY(0px) rotateY(0deg) rotateX(0deg); }
        25% { transform: perspective(1000px) translateY(-3px) rotateY(-1.2deg) rotateX(-0.8deg); }
        50% { transform: perspective(1000px) translateY(-7px) rotateY(0.8deg) rotateX(0.4deg); }
        75% { transform: perspective(1000px) translateY(-4px) rotateY(-0.5deg) rotateX(-0.5deg); }
        100% { transform: perspective(1000px) translateY(0px) rotateY(0deg) rotateX(0deg); }
      }

      .animate-float-3d-odd {
        animation: float3dOdd 7s ease-in-out infinite;
        transform-style: preserve-3d;
      }

      .animate-float-3d-even {
        animation: float3dEven 9s ease-in-out infinite;
        transform-style: preserve-3d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
